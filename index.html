<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Proposal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ffd6e7,#ff7ea8);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
}

.container{
    z-index:5;
    padding:20px;
}

.bear{
    font-size:70px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

h1{
    font-family:'Dancing Script',cursive;
    font-size:clamp(2.2rem,6vw,4.5rem);
    color:white;
    margin:15px 0;
}

.subtitle{
    color:white;
    font-style:italic;
    margin-bottom:20px;
}

.closing{
    color:white;
    margin-top:25px;
    font-size:1rem;
}

.buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    margin-top:30px;
}

#yesBtn{
    border:none;
    padding:16px 40px;
    border-radius:999px;
    background:linear-gradient(45deg,#ff1f5a,#ff5d8f);
    color:white;
    font-size:1.2rem;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 15px rgba(255,0,80,.5);
}

#yesBtn:hover{
    transform:scale(1.08);
    box-shadow:0 0 25px rgba(255,0,80,.9);
}

#noBtn{
    background:white;
    color:#ff1f5a;
    border:2px solid #ff1f5a;
    padding:12px 24px;
    border-radius:999px;
    cursor:pointer;
    transition:.3s;
}

.heart{
    position:fixed;
    bottom:-50px;
    pointer-events:none;
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    from{
        transform:translateY(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    80%{
        opacity:1;
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

.celebration{
    display:none;
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#ffb6d5,#ff5f8f);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
}

.yay{
    color:white;
    font-size:clamp(3rem,10vw,7rem);
    font-weight:bold;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.15);}
}

.spin{
    font-size:90px;
    animation:spin 3s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.celebration p{
    color:white;
    font-size:1.3rem;
    margin-top:15px;
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-20px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(120vh) rotate(720deg);
    }
}
</style>
</head>
<body>

<div id="hearts"></div>

<div class="container" id="mainContent">
    <div class="bear">🧸</div>

    <h1>Will You Be My Valentine, ANUU?</h1>

    <div class="subtitle">
        I've been gathering courage to ask you this...
    </div>

    <div class="buttons">
        <button id="yesBtn">Yes ❤️</button>
        <button id="noBtn">No</button>
    </div>

    <div class="closing">
        Every love story is beautiful, but ours is my favourite
    </div>
</div>

<div class="celebration" id="celebration">
    <div class="yay">Yayyyy!!</div>
    <div class="spin">🥳</div>
    <p>I knew you'd say yes...</p>
</div>

<script>
const heartsContainer=document.getElementById("hearts");

function createHeart(){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";

    const size=Math.random()*25+15;
    heart.style.fontSize=size+"px";
    heart.style.left=Math.random()*100+"vw";

    const duration=Math.random()*6+6;
    heart.style.animationDuration=duration+"s";

    heartsContainer.appendChild(heart);

    setTimeout(()=>heart.remove(),duration*1000);
}

let heartInterval=setInterval(()=>{
    if(document.querySelectorAll(".heart").length<15){
        createHeart();
    }
},400);

const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");

const messages=[
"Nope, not an option!",
"Try again!",
"You sure about that?",
"Not happening!",
"Think again!"
];

let msgIndex=0;

function moveButton(){

    const yesRect=yesBtn.getBoundingClientRect();

    let x,y;
    let safe=false;

    while(!safe){
        x=Math.random()*(window.innerWidth-140);
        y=Math.random()*(window.innerHeight-70);

        if(
            x+140 < yesRect.left-40 ||
            x > yesRect.right+40 ||
            y+70 < yesRect.top-40 ||
            y > yesRect.bottom+40
        ){
            safe=true;
        }
    }

    noBtn.style.position="fixed";
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";

    noBtn.textContent=messages[msgIndex];
    msgIndex=(msgIndex+1)%messages.length;
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);
noBtn.addEventListener("touchstart",moveButton);

document.getElementById("yesBtn").addEventListener("click",()=>{

    document.getElementById("mainContent").style.display="none";

    clearInterval(heartInterval);
    heartsContainer.innerHTML="";

    document.getElementById("celebration").style.display="flex";

    for(let i=0;i<120;i++){

        const conf=document.createElement("div");
        conf.classList.add("confetti");

        conf.style.left=Math.random()*100+"vw";
        conf.style.background=
        `hsl(${Math.random()*360},100%,60%)`;

        conf.style.animationDuration=
        (Math.random()*3+2)+"s";

        conf.style.width=(Math.random()*8+6)+"px";
        conf.style.height=(Math.random()*8+6)+"px";

        document.body.appendChild(conf);

        setTimeout(()=>{
            conf.remove();
        },5000);
    }
});
</script>

</body>
</html>
